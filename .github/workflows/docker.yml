name: Docker build, Trivy scan, push

# Reusable: build the image, scan it with Trivy, push only if the scan passes.
# Caller:
#   jobs:
#     push_to_registry:
#       uses: blinddreamer/workflows/.github/workflows/docker.yml@main
#       with:
#         image: blinddreamer/<name>:latest
#       secrets: inherit

on:
  workflow_call:
    inputs:
      image:
        description: Full image ref to build and push, e.g. blinddreamer/foo:latest
        required: true
        type: string
      push:
        type: boolean
        default: true
      context:
        type: string
        default: .
      file:
        description: Dockerfile path (default <context>/Dockerfile)
        type: string
        default: ''
      pull:
        type: boolean
        default: false
      no-cache:
        type: boolean
        default: false
      severity:
        type: string
        default: CRITICAL,HIGH
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build:
    name: Build, scan, push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          pull: ${{ inputs.pull }}
          no-cache: ${{ inputs.no-cache }}
          load: true
          tags: ${{ inputs.image }}

      # Pinned by SHA (v0.36.0): trivy-action tags were hijacked in 2026, never use a bare tag
      - name: Trivy scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ${{ inputs.image }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        if: inputs.push
        run: docker push "${{ inputs.image }}"
